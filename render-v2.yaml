services:
  # PostgreSQL Database
  - type: pserv
    name: underwritepro-db-v2
    plan: starter
    region: oregon
    databaseName: underwritepro
    databaseUser: underwritepro
    ipAllowList: []

  # Web Service
  - type: web
    name: underwritepro-v2
    runtime: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && python main_apple_grade.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: underwritepro-db-v2
          property: connectionString
      - key: JWT_SECRET_KEY
        value: e7d0ef4a67518c6ce9849a5f133033df1bcd3110bb4accfecf2dc5516b13f9a0
      - key: OPENAI_API_KEY
        value: sk-gU2FSLRqSNMJsvWm7ewuDX
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.0
